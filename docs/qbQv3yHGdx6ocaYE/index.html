<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Painel CBMSC - Rodrigues Preventivos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
 :root{
   --bg:#0d0d10;             /* preto suave de fundo */
   --panel:#1a1a20;          /* cinza-escuro pros cards */
   --accent:#e8334a;         /* vermelho da logo Rodrigues */
   --accent-light:#ff5566;
   --text:#f5f5f7;
   --muted:#8a8a95;
   --mul:#e8334a;            /* mesmo vermelho da logo (consistencia) */
   --af:#4a9eff;             /* azul mais vivo */
   --ok:#26de81;
   --header:#15151a;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
 #app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
 header{background:var(--header);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,0.6)}
 header .brand{display:flex;align-items:center;gap:18px}
 header .logo-img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(232,51,74,0.4))}
 header .titulo{display:flex;flex-direction:column;gap:2px}
 header h1{font-size:20px;color:var(--text);letter-spacing:1px;display:flex;align-items:center;gap:10px;font-weight:300;text-transform:uppercase}
 header h1 .pulse{width:12px;height:12px;background:var(--ok);border-radius:50%;animation:pulse 1.8s infinite}
 header .subtitle{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(38,222,129,0.7)}50%{box-shadow:0 0 0 12px rgba(38,222,129,0)}}
 header .stats{display:flex;gap:22px;font-size:13px}
 header .stats div{color:var(--muted)}
 header .stats div b{color:var(--text);font-size:18px;display:block}
 header .stats .stat-mul b{color:var(--mul)}
 header .stats .stat-af b{color:var(--af)}
 #scroll-area{overflow-y:auto;scroll-behavior:auto}
 #scroll-area::-webkit-scrollbar{width:0}
 #grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(680px,1fr));gap:18px;align-content:start}
 .cidade{background:var(--panel);border-radius:12px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,0.3);display:flex;flex-direction:column}
 .cidade-h{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:8px}
 .cidade-nome{font-size:24px;color:var(--accent);font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
 .cidade-counts{display:flex;gap:6px}
 .count-pill{font-weight:bold;padding:3px 10px;border-radius:14px;font-size:12px}
 .count-pill.mul{background:var(--mul);color:#fff}
 .count-pill.af{background:var(--af);color:#fff}
 .cidade-meta{font-size:11px;color:var(--muted);margin-bottom:8px}
 .cidade-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .col-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:bold;padding-bottom:6px;border-bottom:1px solid #1a3553;margin-bottom:4px}
 .col-h.mul{color:var(--mul)} .col-h.af{color:var(--af)}
 .col-h .ico{font-size:14px}
 .col-list{padding-right:2px}
 .item{padding:6px 8px;border-bottom:1px solid #1a3553;font-size:12px;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:start}
 .item-data{display:flex;flex-direction:column;gap:1px;min-width:0}
 .item-cod{font-family:Consolas,'Courier New',monospace;font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.3px}
 .item-cod.mul{color:var(--mul)} .item-cod.af{color:var(--af)}
 .item-nome{font-weight:600;font-size:13px;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .item-end{color:var(--muted);font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
 .item-acoes{display:flex;flex-direction:column;gap:3px}
 .btn-esci,.btn-tel,.btn-mail{color:#fff;border:none;padding:3px 6px;font-size:10px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;text-align:center}
 .btn-esci{background:#1a3553;color:var(--accent)}
 .btn-esci:hover{background:var(--accent);color:var(--header)}
 .btn-tel{background:#25D366}     /* verde WhatsApp */
 .btn-tel:hover{background:#1ea952}
 .btn-mail{background:#5e72e4}
 .btn-mail:hover{background:#4257c1}
 .item-drill{margin-top:4px;padding-top:4px;border-top:1px dashed #1a3553;font-size:10.5px;line-height:1.3}
 .drill-row{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}
 .drill-row b{color:var(--text)}
 .drill-exig{color:#ffb84d;font-weight:600;margin-top:2px;font-size:11px}
 .drill-prazo{display:inline-block;padding:1px 6px;border-radius:8px;font-weight:bold;font-size:10px;margin-left:4px}
 .drill-prazo.vencido{background:#c00;color:#fff}
 .drill-prazo.urgente{background:#ff8c00;color:#fff}
 .drill-prazo.ok{background:#26de81;color:#0a1929}
 .item.nova-recente{background:linear-gradient(90deg,rgba(255,140,0,0.20),rgba(255,140,0,0.04));border-left:4px solid #ff8c00;box-shadow:0 0 8px rgba(255,140,0,0.3)}
 .item.nova-flash{animation:flash 2s ease-in-out 3}
 @keyframes flash{0%,100%{background-color:rgba(255,184,77,0.15)}50%{background-color:rgba(255,184,77,0.55)}}
 .item-detectado{font-size:10px;color:#ff8c00;font-weight:bold;margin-top:1px}
 .col-empty{text-align:center;padding:14px 0;color:var(--muted);font-style:italic;font-size:11px}
 footer{background:var(--header);padding:8px 28px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);border-top:1px solid #1a3553}
 footer .right{display:flex;gap:18px;align-items:center}
 #banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#ff4757,#ff6b6b);color:#fff;padding:18px 28px;font-size:22px;font-weight:bold;text-align:center;transform:translateY(-100%);transition:transform 0.5s ease;z-index:1000;box-shadow:0 4px 20px rgba(255,71,87,0.6)}
 #banner.show{transform:translateY(0)}
 #banner.af{background:linear-gradient(90deg,#3498db,#5dade2)}
 #banner .icon{font-size:28px;margin-right:14px}
 .empty-state{text-align:center;padding:40px;color:var(--muted);font-style:italic}
 /* toast de codigo copiado */
 #toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%) translateY(120px);background:#26de81;color:#0a1929;padding:16px 28px;border-radius:10px;font-size:18px;font-weight:bold;z-index:2000;box-shadow:0 6px 24px rgba(0,0,0,0.5);transition:transform 0.4s ease;text-align:center;line-height:1.4}
 #toast.show{transform:translateX(-50%) translateY(0)}
 #toast .cod{font-family:Consolas,monospace;font-size:20px;display:block;margin-top:4px}
 #toast .hint{font-size:13px;font-weight:normal;display:block;margin-top:6px;opacity:0.85}
 /* header pisca quando ha lead novo */
 @keyframes header-alert{0%,100%{background:var(--header)}50%{background:#c00}}
 header.alert{animation:header-alert 1s ease-in-out 6}
 /* botao habilitar som */
 #btn-som{background:#26de81;color:#0a1929;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;display:none}
 #btn-som.show{display:inline-block}
 #btn-som:hover{background:#1ec76d}
 #btn-som.ativo{background:#1a3553;color:var(--muted);cursor:default}
</style>
</head>
<body>
<div id="banner"><span class="icon">🚨</span><span id="banner-text"></span></div>
<div id="toast">✓ Código copiado!<span class="cod" id="toast-cod"></span><span class="hint">Cole no campo de busca do e-SCI com <b>Ctrl + V</b></span></div>
<div id="app">
 <header>
  <div class="brand">
   <img src="logo.png" alt="Rodrigues Preventivos" class="logo-img" onerror="this.style.display='none'">
   <div class="titulo">
    <h1><span class="pulse"></span>Painel CBMSC</h1>
    <div class="subtitle">Multas & Autos de Fiscalização em tempo real</div>
   </div>
  </div>
  <div class="stats">
   <div class="stat-mul">Multas<b id="total-mul">—</b></div>
   <div class="stat-af">Fiscalizações<b id="total-af">—</b></div>
   <div>Cidades<b id="cid-count">—</b></div>
   <div>Hoje<b id="hoje">—</b></div>
   <button id="btn-som" onclick="habilitarSom()" title="Clica 1x ao ligar a TV pra liberar som">🔔 Ativar som</button>
  </div>
 </header>
 <div id="scroll-area"><div id="grid"><div class="empty-state">Carregando...</div></div></div>
 <footer>
  <div>📡 Coleta automática a cada 10 min (seg-sex 08:00-18:00 BRT) via GitHub Actions</div>
  <div class="right">
   <span>Última atualização: <span id="last-update">—</span></span>
  </div>
 </footer>
</div>
<script>
const POLL_MS = 60000;
let codigosConhecidos = new Set();
let primeiraCarga = true;

function ding(curto){
  if(!somAtivado) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    o.start(); o.stop(ctx.currentTime + 0.7);
    if(!curto){
      setTimeout(()=>{
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.type = "sine"; o2.frequency.value = 1320;
        g2.gain.setValueAtTime(0, ctx.currentTime);
        g2.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.01);
        g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        o2.start(); o2.stop(ctx.currentTime + 0.6);
      }, 150);
      // repete 2x mais pra TV
      setTimeout(()=>ding(true), 800);
      setTimeout(()=>ding(true), 1600);
    }
  }catch(e){console.warn("audio:", e);}
}

function flashHeader(){
  const h = document.querySelector("header");
  h.classList.remove("alert");
  void h.offsetWidth; // reset animation
  h.classList.add("alert");
  setTimeout(()=>h.classList.remove("alert"), 7000);
}

function fmtDetectado(iso){
  if(!iso) return null;
  try{
    const d = new Date(iso);
    const agora = new Date();
    const diffMs = agora - d;
    const diffH = diffMs / (1000*60*60);
    if(diffH < 1){
      const mins = Math.floor(diffMs/60000);
      return `🟧 detectado há ${mins} min`;
    }
    if(diffH < 24){
      return `🟧 detectado há ${Math.floor(diffH)}h`;
    }
    if(diffH < 48){
      return `📅 ontem ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`;
    }
    return `📅 ${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){ return null; }
}

function ehRecente(iso){
  if(!iso) return false;
  try{
    const d = new Date(iso);
    return (Date.now() - d.getTime()) < 24*60*60*1000;  // 24h
  }catch(e){ return false; }
}

function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function mostrarBanner(tipo, cidade, nome, codigo){
  const b = document.getElementById("banner");
  document.getElementById("banner-text").textContent = `NOV${tipo==='MUL'?'A MULTA':'O AUTO DE FISCALIZAÇÃO'} em ${cidade}: ${nome} (${codigo})`;
  b.className = tipo === 'AF' ? 'af show' : 'show';
  ding();
  flashHeader();
  setTimeout(()=>b.classList.remove("show"), 30000);
}

// URL pra abrir direto no e-SCI ja com a busca preenchida
function eSciURL(codigo){
  return "https://esci.cbm.sc.gov.br/Safe/Geral/ControllerConsultaGeral/";
}

let toastTimer = null;
function abrirESci(ev, codigo){
  ev.preventDefault();
  // copia o codigo pro clipboard
  try{ navigator.clipboard.writeText(codigo); }catch(e){
    // fallback pra navegadores antigos de TV
    const ta=document.createElement('textarea'); ta.value=codigo;
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(e2){} ta.remove();
  }
  // mostra toast
  const t=document.getElementById("toast");
  document.getElementById("toast-cod").textContent=codigo;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"), 6000);
  // abre o e-SCI em nova aba
  window.open(eSciURL(codigo), "_blank", "noopener");
  return false;
}

// === SOM (TV smart precisa interacao previa pra desbloquear) ===
let somAtivado = false;
let audio = null;

function habilitarSom(){
  somAtivado = true;
  const btn = document.getElementById("btn-som");
  btn.textContent = "🔔 Som ativado";
  btn.classList.add("ativo");
  btn.onclick = null;
  localStorage.setItem("painel_som_ativado", "1");
  // toca som de teste curto pra confirmar
  ding(true);
}

// recuperar estado do som ativado (caso recarregue)
if(localStorage.getItem("painel_som_ativado") === "1"){
  somAtivado = true;
}

function soNumero(s){ return (s||"").replace(/\D/g,""); }
function waLink(tel){
  const n = soNumero(tel);
  if(!n || n.length < 8) return null;
  // garante codigo BR
  const num = n.startsWith("55") ? n : ("55"+n);
  return "https://wa.me/" + num;
}

function badgePrazo(dias){
  if(dias === null || dias === undefined) return "";
  if(dias < 0) return `<span class="drill-prazo vencido">${Math.abs(dias)}d VENCIDO</span>`;
  if(dias <= 30) return `<span class="drill-prazo urgente">${dias}d restantes</span>`;
  return `<span class="drill-prazo ok">${dias}d restantes</span>`;
}

function drillHTML(d){
  if(!d) return "";
  const parts = [];
  if(d.responsavel) parts.push(`<div class="drill-row"><b>Resp:</b> ${d.responsavel}</div>`);
  const ex = (d.exigencias || []).join(" · ");
  if(ex){
    parts.push(`<div class="drill-exig">⚠️ ${ex}${badgePrazo(d.prazoDias)}</div>`);
  }
  // botoes contato (so quando ha)
  const btns = [];
  const wa = waLink(d.celular);
  if(wa) btns.push(`<a class="btn-tel" target="_blank" rel="noopener" href="${wa}" title="${d.celular}">💬 WhatsApp</a>`);
  if(d.email) btns.push(`<a class="btn-mail" href="mailto:${d.email}" title="${d.email}">✉️ E-mail</a>`);
  if(btns.length) parts.push(`<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">${btns.join("")}</div>`);
  return parts.length ? `<div class="item-drill">${parts.join("")}</div>` : "";
}

function itemHTML(item, tipo, isFlash, drill){
  const end = `${item.Logradouro || ""}${item.Numero?", "+item.Numero:""} — ${(item.Bairro||"").replace(/^[^-]+ - /,"")}`;
  const cls = tipo.toLowerCase();
  const d = drill && drill[item.CodigoAuto];
  // destaque persistente: se detectado nas ultimas 24h, fica laranja
  const detectIso = item.Detectado_em;
  const recente = ehRecente(detectIso);
  const detectLabel = fmtDetectado(detectIso);
  const classes = ['item'];
  if(recente) classes.push('nova-recente');
  if(isFlash) classes.push('nova-flash');
  return `<div class="${classes.join(' ')}">
   <div class="item-data">
    <div class="item-cod ${cls}">${item.CodigoAuto}</div>
    <div class="item-nome">${item.Nome_Edificacao}</div>
    <div class="item-end">${end}</div>
    ${detectLabel ? `<div class="item-detectado">${detectLabel}</div>` : ''}
    ${drillHTML(d)}
   </div>
   <div class="item-acoes">
    <a class="btn-esci" href="#" onclick="return abrirESci(event, '${item.CodigoAuto}')" title="Copia o código e abre o e-SCI — cole com Ctrl+V">📋 e-SCI</a>
   </div>
  </div>`;
}

let dadosMul = {}, dadosAf = {}, dadosDrill = {};

function render(){
  const cidadesSet = new Set([...Object.keys(dadosMul.multas||{}), ...Object.keys(dadosAf.afs||{})]);
  const totalMul = dadosMul.total_geral || 0;
  const totalAf = dadosAf.total_geral || 0;

  document.getElementById("total-mul").textContent = totalMul;
  document.getElementById("total-af").textContent = totalAf;
  document.getElementById("cid-count").textContent = cidadesSet.size;
  const hoje = new Date().toISOString().slice(0,10);
  const hojeCt = (dadosMul.eventos_recentes||[]).filter(e=>e.ts && e.ts.startsWith(hoje)).length;
  document.getElementById("hoje").textContent = hojeCt;
  document.getElementById("last-update").textContent = fmtDate(dadosMul.timestamp);

  const grid = document.getElementById("grid");
  const cidades = [...cidadesSet].sort();
  if(!cidades.length){ grid.innerHTML = '<div class="empty-state">Nenhum dado carregado.</div>'; return; }

  const html = cidades.map(cid=>{
    const muls = (dadosMul.multas && dadosMul.multas[cid]) || [];
    const afs  = (dadosAf.afs && dadosAf.afs[cid]) || [];
    const cfgM = (dadosMul.cidades && dadosMul.cidades[cid]) || {};
    const cfgA = (dadosAf.cidades && dadosAf.cidades[cid]) || {};
    const meta = [];
    if(cfgM.ultimo_numero) meta.push(`MUL nº ${cfgM.ultimo_numero}/${cfgM.ano_corrente}`);
    if(cfgA.ultimo_numero) meta.push(`AF nº ${cfgA.ultimo_numero}/${cfgA.ano_corrente}`);

    const drill = dadosDrill.drill || {};
    const mulsHTML = muls.slice(0, 20).map(m=>itemHTML(m, 'MUL', !primeiraCarga && !codigosConhecidos.has(m.CodigoAuto), drill)).join("") || '<div class="col-empty">Sem multas</div>';
    const afsHTML  = afs.slice(0, 20).map(m=>itemHTML(m, 'AF',  !primeiraCarga && !codigosConhecidos.has(m.CodigoAuto), drill)).join("") || '<div class="col-empty">Sem fiscalizações</div>';

    return `<div class="cidade">
     <div class="cidade-h">
      <div class="cidade-nome">${cid}</div>
      <div class="cidade-counts">
       <span class="count-pill mul">${muls.length} MUL</span>
       <span class="count-pill af">${afs.length} AF</span>
      </div>
     </div>
     <div class="cidade-meta">${meta.join(' · ')}</div>
     <div class="cidade-split">
      <div>
       <div class="col-h mul"><span class="ico">🚨</span> Multas (mais recentes)</div>
       <div class="col-list">${mulsHTML}</div>
      </div>
      <div>
       <div class="col-h af"><span class="ico">📋</span> Fiscalizações (mais recentes)</div>
       <div class="col-list">${afsHTML}</div>
      </div>
     </div>
    </div>`;
  }).join("");
  grid.innerHTML = html;

  // detectar novos -> banner
  if(!primeiraCarga){
    cidades.forEach(cid=>{
      ((dadosMul.multas && dadosMul.multas[cid])||[]).forEach(m=>{
        if(!codigosConhecidos.has(m.CodigoAuto)) mostrarBanner('MUL', cid, m.Nome_Edificacao, m.CodigoAuto);
      });
      ((dadosAf.afs && dadosAf.afs[cid])||[]).forEach(a=>{
        if(!codigosConhecidos.has(a.CodigoAuto)) mostrarBanner('AF', cid, a.Nome_Edificacao, a.CodigoAuto);
      });
    });
  }
  codigosConhecidos = new Set();
  cidades.forEach(cid=>{
    ((dadosMul.multas && dadosMul.multas[cid])||[]).forEach(m=>codigosConhecidos.add(m.CodigoAuto));
    ((dadosAf.afs && dadosAf.afs[cid])||[]).forEach(a=>codigosConhecidos.add(a.CodigoAuto));
  });
  primeiraCarga = false;
}

async function refresh(){
  try{
    const [rMul, rAf, rDrill] = await Promise.all([
      fetch("dados.json?t=" + Date.now(), {cache:"no-store"}),
      fetch("afs.json?t=" + Date.now(), {cache:"no-store"}).catch(()=>null),
      fetch("drill.json?t=" + Date.now(), {cache:"no-store"}).catch(()=>null)
    ]);
    if(rMul.ok) dadosMul = await rMul.json();
    if(rAf && rAf.ok) dadosAf = await rAf.json();
    if(rDrill && rDrill.ok) dadosDrill = await rDrill.json();
    render();
  }catch(e){
    console.error(e);
    document.getElementById("last-update").textContent = "ERRO: " + e.message;
  }
}

refresh();
setInterval(refresh, POLL_MS);

// mostrar botao de som se ainda nao foi ativado
if(!somAtivado) document.getElementById("btn-som").classList.add("show");

// re-renderizar a cada 5 min pra atualizar labels "ha X min"
setInterval(()=>{ if(Object.keys(dadosMul.multas||{}).length) render(); }, 5*60*1000);

// === AUTO-SCROLL ===
const SCROLL_PIXELS_PER_TICK = 1;
const SCROLL_TICK_MS = 40;
const PAUSE_AT_TOP_MS = 4000;
const PAUSE_AT_BOTTOM_MS = 4000;
let scrollDir = 1;
let scrollPaused = false;
const scrollArea = document.getElementById("scroll-area");
function bannerAtivo(){ return document.getElementById("banner").classList.contains("show"); }
function autoScrollTick(){
  if(scrollPaused || bannerAtivo()) return;
  const max = scrollArea.scrollHeight - scrollArea.clientHeight;
  if(max <= 0) return;
  const cur = scrollArea.scrollTop;
  if(scrollDir === 1){
    if(cur >= max - 1){
      scrollPaused = true;
      setTimeout(()=>{ scrollDir = -1; scrollPaused = false; }, PAUSE_AT_BOTTOM_MS);
    } else { scrollArea.scrollTop = cur + SCROLL_PIXELS_PER_TICK; }
  } else {
    if(cur <= 0){
      scrollPaused = true;
      setTimeout(()=>{ scrollDir = 1; scrollPaused = false; }, PAUSE_AT_TOP_MS);
    } else { scrollArea.scrollTop = cur - SCROLL_PIXELS_PER_TICK; }
  }
}
setInterval(autoScrollTick, SCROLL_TICK_MS);
let manualScrollTimer = null;
function pauseManual(){
  scrollPaused = true;
  clearTimeout(manualScrollTimer);
  manualScrollTimer = setTimeout(()=>{ scrollPaused = false; }, 30000);
}
scrollArea.addEventListener("wheel", pauseManual);
scrollArea.addEventListener("touchstart", pauseManual);
</script>
</body>
</html>
