name: Polling de Multas e Fiscalizações CBMSC

on:
  schedule:
    # A cada 30 min entre 11:00 e 21:00 UTC = 08:00-18:00 BRT (UTC-3)
    # Aumentei de 10 -> 30 min porque cada run leva ~7-8 min (ambiente do GitHub e' lento)
    # e estava overlapping com o proximo run.
    - cron: '*/30 11-21 * * 1-5'
  workflow_dispatch:  # permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-multas
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar Multas
        run: python scripts/coletar.py

      - name: Coletar Autos de Fiscalização
        run: python scripts/coletar_afs.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
