name: Polling de Multas e Fiscalizações CBMSC

on:
  # DESLIGADO 2026-06-23: o coletor LOCAL (PC, a cada 10 min, faz multas+AFs+PROTOCOLOS)
  # virou a unica fonte. O cron do Actions rodava em paralelo, o origin "andava" sozinho,
  # o push do PC era rejeitado e os protocolos ficavam presos (ahead/behind). Sem cron,
  # so o PC empurra -> sem divergencia. Fica so manual (botao Run no GitHub) se precisar.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-multas
      cancel-in-progress: true   # se vier outro run, cancela o antigo (evita fila travada)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar Multas
        run: python scripts/coletar.py

      - name: Coletar Autos de Fiscalização
        run: python scripts/coletar_afs.py

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
